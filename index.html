<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POE — Case 1: The Beating Heart</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101114;
    --panel: #191b20;
    --panel2: #20232a;
    --line: #343842;
    --text: #ececf0;
    --muted: #a4a8b2;
    --accent: #c9a66b;
    --accent-dim: #806b4c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at top, #22242a 0, var(--bg) 55%);
    color: var(--text);
    font: 16px/1.5 Georgia, "Times New Roman", serif;
    min-height: 100vh;
  }
  .wrap { width: min(850px, calc(100% - 32px)); margin: 0 auto; padding: 44px 0 72px; }
  header { text-align: center; margin-bottom: 34px; }
  .brand { letter-spacing: .34em; font: 700 13px/1.2 Arial, sans-serif; color: var(--accent); }
  h1 { font-size: clamp(32px, 7vw, 48px); font-weight: 400; margin: 12px 0 4px; }
  .subtitle { color: var(--muted); font: 12px Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
  .intro { color: var(--muted); text-align: center; font: 14px/1.6 Arial, sans-serif; margin: 22px auto 30px; max-width: 560px; }
  .step {
    background: linear-gradient(145deg, var(--panel), #15171b);
    border: 1px solid var(--line);
    border-radius: 9px;
    margin: 10px 0;
    overflow: hidden;
  }
  .step-head {
    width: 100%; border: 0; color: inherit; background: transparent;
    display: flex; align-items: center; gap: 14px; text-align: left;
    padding: 16px 18px; cursor: pointer; font: inherit;
  }
  .step-head:hover { background: rgba(255,255,255,.035); }
  .step-no { color: var(--accent); font: 700 12px Arial, sans-serif; letter-spacing: .1em; white-space: nowrap; }
  .location { flex: 1; color: var(--muted); font: 14px Arial, sans-serif; }
  .location.revealed { color: var(--text); }
  .step-head .chevron { color: var(--accent); transition: transform .18s ease; }
  .step.open .chevron { transform: rotate(180deg); }
  .step-body { display: none; border-top: 1px solid var(--line); padding: 14px 18px 18px; }
  .step.open .step-body { display: block; }
  .hint {
    border: 1px solid var(--line); border-radius: 7px; margin-top: 9px; overflow: hidden;
    background: rgba(255,255,255,.018);
  }
  .hint:first-child { margin-top: 0; }
  .hint-button {
    width: 100%; border: 0; background: transparent; color: var(--text);
    padding: 13px 14px; text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 12px; font: 14px Arial, sans-serif;
  }
  .hint-button:hover { background: rgba(255,255,255,.04); }
  .hint-number { color: var(--accent); font-weight: 700; min-width: 20px; }
  .hint-label { flex: 1; }
  .hint-state { color: var(--muted); font-size: 11px; }
  .hint-content { display: none; padding: 0 14px 14px 46px; color: #d9dbe0; font: 14px/1.65 Arial, sans-serif; white-space: pre-wrap; }
  .hint.revealed .hint-content { display: block; }
  .hint.revealed .hint-state { color: var(--accent); }
  .hint.empty { opacity: .45; }
  .hint.empty .hint-button { cursor: default; }
  .footer { text-align: center; color: #777d88; font: 11px Arial, sans-serif; margin-top: 30px; letter-spacing: .08em; }
  .error { color: #ffb4a8; text-align: center; font: 14px Arial, sans-serif; padding: 24px; }
  @media (max-width: 520px) {
    .wrap { width: min(100% - 20px, 850px); padding-top: 28px; }
    .step-head { padding: 15px 13px; gap: 10px; }
    .step-body { padding: 11px 12px 14px; }
    .hint-content { padding-left: 14px; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="brand">P O E</div>
    <h1>Case 1</h1>
    <div class="subtitle">The Beating Heart</div>
  </header>
  <p class="intro">Select a step to view its location. Hints are optional and reveal one at a time.</p>
  <section id="steps" aria-label="Case steps"></section>
  <div class="footer">POE · CASE 1</div>
</main>
<script>
const HINT_LABELS = ["General Hint", "More Detailed Hint", "Full Walkthrough"];

function makeHint(text, index) {
  const item = document.createElement("div");
  item.className = "hint" + (text ? "" : " empty");

  const button = document.createElement("button");
  button.className = "hint-button";
  button.type = "button";
  button.disabled = !text;
  button.setAttribute("aria-expanded", "false");

  const number = document.createElement("span");
  number.className = "hint-number";
  number.textContent = String(index + 1) + ".";
  const label = document.createElement("span");
  label.className = "hint-label";
  label.textContent = HINT_LABELS[index];
  const state = document.createElement("span");
  state.className = "hint-state";
  state.textContent = text ? "Click to reveal" : "Not provided";

  const content = document.createElement("div");
  content.className = "hint-content";
  content.textContent = text || "";

  button.append(number, label, state);
  item.append(button, content);

  if (text) {
    button.addEventListener("click", () => {
      if (item.classList.contains("revealed")) return;
      item.classList.add("revealed");
      button.setAttribute("aria-expanded", "true");
      state.textContent = "Revealed";
    });
  }
  return item;
}

function render(data) {
  document.title = `${data.game} — Case ${data.case}: ${data.title}`;
  document.querySelector("header h1").textContent = `Case ${data.case}`;
  document.querySelector(".subtitle").textContent = data.title;

  const root = document.getElementById("steps");
  root.replaceChildren();

  data.steps.forEach(stepData => {
    const step = document.createElement("article");
    step.className = "step";

    const head = document.createElement("button");
    head.className = "step-head";
    head.type = "button";
    head.setAttribute("aria-expanded", "false");

    const no = document.createElement("span");
    no.className = "step-no";
    no.textContent = `STEP ${stepData.number}`;

    const location = document.createElement("span");
    location.className = "location";
    location.textContent = "Click to reveal location";

    const chevron = document.createElement("span");
    chevron.className = "chevron";
    chevron.textContent = "⌄";
    chevron.setAttribute("aria-hidden", "true");

    head.append(no, location, chevron);

    const body = document.createElement("div");
    body.className = "step-body";
    (stepData.hints || []).slice(0, 3).forEach((hint, i) => body.append(makeHint(hint, i)));

    head.addEventListener("click", () => {
      const opening = !step.classList.contains("open");
      step.classList.toggle("open", opening);
      location.textContent = opening ? stepData.location : "Click to reveal location";
      location.classList.toggle("revealed", opening);
      head.setAttribute("aria-expanded", String(opening));
    });

    step.append(head, body);
    root.append(step);
  });
}

fetch("./case1.json")
  .then(response => {
    if (!response.ok) throw new Error("Could not load case1.json");
    return response.json();
  })
  .then(render)
  .catch(() => {
    document.getElementById("steps").innerHTML =
      '<p class="error">The walkthrough data could not be loaded. Make sure index.html and case1.json are in the same folder and open the site through a web server.</p>';
  });
</script>
</body>
</html>
